<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ยื่นใบลาใหม่ · LeaveEasy</title>
  <link rel="stylesheet" href="css/style.css">
  <script src="js/util.js" defer></script>
  <script src="js/nav.js" defer></script>
  <script src="js/data.js" defer></script>
  <script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-app-compat.js" defer></script>
  <script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-auth-compat.js" defer></script>
  <script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore-compat.js" defer></script>
  <script src="js/firebase-config.js" defer></script>
  <script src="js/ai-config.js" defer></script>
  <script src="js/ai-service.js" defer></script>
  <script src="js/new-leave-request.js" defer></script>
</head>
<body>
  <div id="nav"></div>

  <div class="container">
    <h1>ยื่นใบลาใหม่</h1>
    <p class="subtitle">กรอกให้ครบทุกช่อง แล้วกดบันทึก · ใบลาใหม่จะมีสถานะ รอพิจารณา เสมอ</p>

    <div class="card">
      <div id="ข้อความเตือน" class="alert alert-error hidden"></div>

      <form id="ฟอร์มใบลา">
        <label for="title">หัวข้อ</label>
        <input type="text" id="title" placeholder="เช่น ลาพักร้อนไปเที่ยวกับครอบครัว">

        <label for="reason">เหตุผลการลา</label>
        <textarea id="reason" placeholder="เล่าเหตุผลสั้น ๆ ให้หัวหน้าเข้าใจ"></textarea>

        <div style="margin-top: 6px; margin-bottom: 12px;">
          <button type="button" id="ปุ่มaiช่วยเลือก" class="btn-ghost" style="border: 1px solid #b9ccf5; background: #eef4ff; color: #1a3e7a; font-size: 15px; padding: 7px 14px;">
            🤖 ให้ AI ช่วยเลือกประเภทการลา
          </button>
        </div>

        <div id="กล่องเตือนai" class="alert alert-ai hidden" style="margin-bottom: 14px;"></div>

        <label for="leaveTypeId">ประเภทการลา</label>
        <select id="leaveTypeId">
          <option value="">— เลือกประเภทการลา —</option>
        </select>

        <label for="startDate">วันที่เริ่มลา</label>
        <input type="date" id="startDate">

        <label for="endDate">วันที่สิ้นสุด</label>
        <input type="date" id="endDate">

        <div class="btn-row">
          <button type="submit" id="ปุ่มบันทึก">บันทึก</button>
          <a class="btn btn-ghost" href="leave-requests.html">ยกเลิก</a>
        </div>
      </form>
    </div>
  </div>
</body>
</html>
